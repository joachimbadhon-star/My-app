<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mobile App</title>

  <!-- Dynamic Web App Manifest via Data URI -->
  <link id="manifest-placeholder" rel="manifest">

  <!-- iOS / Safari Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My App">
  <meta name="theme-color" content="#4F46E5">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #F3F4F6;
      color: #1F2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: #FFFFFF;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    p {
      color: #6B7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Audio Player Styling */
    .audio-player-container {
      margin-bottom: 24px;
      padding: 12px;
      background: #F9FAFB;
      border-radius: 12px;
      border: 1px solid #E5E7EB;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }

    .btn-install {
      background-color: #4F46E5;
      color: #FFFFFF;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
      transition: all 0.2s ease;
      display: none;
    }

    .btn-install:active {
      transform: scale(0.98);
      background-color: #4338CA;
    }

    .ios-instructions {
      display: none;
      background-color: #EFF6FF;
      border: 1px solid #BFDBFE;
      color: #1E40AF;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
    }

    .installed-msg {
      display: none;
      background-color: #ECFDF5;
      color: #065F46;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="app-icon">🎵</div>
    <h1>Welcome to My App</h1>
    <p>Add this application to your home screen for quick access and full-screen experience.</p>

    <!-- Audio Player Section -->
    <div class="audio-player-container">
      <audio controls loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>

    <!-- Android / Chrome Install Button -->
    <button id="install-btn" class="btn-install">Add to Home Screen</button>

    <!-- iOS Safari Instructions -->
    <div id="ios-prompt" class="ios-instructions">
      <strong>To install on iOS:</strong><br>
      1. Tap the <strong>Share</strong> button <span style="font-size:16px;">⎋</span> in Safari.<br>
      2. Scroll down and tap <strong>Add to Home Screen</strong> <span style="font-size:16px;">➕</span>.
    </div>

    <!-- App Already Installed Message -->
    <div id="installed-msg" class="installed-msg">
      ✓ App is running from your Home Screen!
    </div>
  </div>

  <script>
    // 1. Inject Dynamic Web Manifest
    const manifest = {
      "name": "My Mobile App",
      "short_name": "MyApp",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#F3F4F6",
      "theme_color": "#4F46E5",
      "icons": [
        {
          "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234F46E5'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'>🎵</text></svg>",
          "sizes": "192x192",
          "type": "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

    // 2. Register Inline Service Worker
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      
      navigator.serviceWorker.register(swUrl)
        .then(() => console.log('Service Worker Active'))
        .catch(err => console.log('SW registration skipped or error:', err));
    }

    // 3. App Install Logic & Detection
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    const iosPrompt = document.getElementById('ios-prompt');
    const installedMsg = document.getElementById('installed-msg');

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (isStandalone) {
      installedMsg.style.display = 'block';
    } else {
      if (isIOS) {
        iosPrompt.style.display = 'block';
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`User response: ${outcome}`);
          deferredPrompt = null;
          installBtn.style.display = 'none';
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      iosPrompt.style.display = 'none';
      installedMsg.style.display = 'block';
    });
  </script>
</body>
</html>
