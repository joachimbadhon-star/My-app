
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, Student!</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome {
            padding: 40px 25px;
            max-width: 450px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #d6deea;
        }

        button {
            margin-top: 20px;
            padding: 13px 28px;
            border: none;
            border-radius: 30px;
            background: #ffffff;
            color: #243b55;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #dce6f5;
        }
    </style>
</head>

<body>

    <div class="welcome">
        <h1>Hello, Student! 👋</h1>

        <p>
            We're glad you're here.
            Every day is another opportunity
            to learn something new, make progress,
            and become a better version of yourself.
        </p>

        <p>
            Take your time, enjoy the journey,
            and remember — you've got this!
        </p>

        <button onclick="sayHello()">
            Say Hello!
        </button>
    </div>

    <script>
        function sayHello() {
            alert("Hey there! 😊 Hope you're having a great day. Keep learning!");
        }
    </script>

</body>
</html>
