
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থী স্বাগতম</title>

    <style>
        body {
            margin: 0;
            font-family: "Noto Sans Bengali", sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome {
            padding: 35px 25px;
            max-width: 450px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
            line-height: 1.9;
            color: #d6deea;
        }

        button {
            margin-top: 20px;
            padding: 13px 28px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #243b55;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #dce6f5;
        }
    </style>
</head>

<body>

    <div class="welcome">
        <h1>কী খবর, শিক্ষার্থী? 👋</h1>

        <p>
            আশা করি ভালো আছো!
            নতুন কিছু শেখার জন্য প্রস্তুত তো?
        </p>

        <p>
            মনে রেখো, সবকিছু একদিনে শেখা সম্ভব না।
            একটু একটু করে এগিয়ে যাও।
            ভুল হলে সমস্যা নেই, ভুল থেকেই তো শেখা!
        </p>

        <p>
            তো, আজ কী শেখা যাক? 😊
        </p>

        <button onclick="sayHello()">
            এখানে ক্লিক করো
        </button>
    </div>

    <script>
        function sayHello() {
            const messages = [
                "কী রে! সব ঠিকঠাক বুঝতেছিস তো? 😄",
                "আরে, ভয় পাওয়ার কিছু নেই! ধীরে ধীরে শেখ।",
                "কিছু না বুঝলে আবার চেষ্টা কর, আমি আছি!",
                "পড়াশোনার পাশাপাশি একটু হাসিখুশিও থাকিস! 😁",
                "আজকে কিন্তু নতুন কিছু শিখতেই হবে!"
            ];

            const randomMessage =
                messages[Math.floor(Math.random() * messages.length)];

            alert(randomMessage);
        }
    </script>

</body>
</html>
